<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="배움 교육 숏폼 학습 시작"><title>배움 | 교육 숏폼</title><link rel="icon" href="data:,"><style>
*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;padding:24px;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;background:radial-gradient(circle at 50% 20%,#273141,#0f1115 65%);color:#fff}.card{width:min(480px,100%);padding:40px 30px;border:1px solid #ffffff20;border-radius:24px;background:#111722bb;text-align:center}.logo{font-size:38px;color:#b7d4ff}h1{margin:14px 0 10px;font-size:38px}p{color:#bdc9d9;line-height:1.7}.actions{display:grid;gap:12px;margin-top:28px}a,button{font-family:inherit;font-size:16px;line-height:1.5;border-radius:12px;padding:14px 18px;text-decoration:none;cursor:pointer}a{display:block;background:#e4efff;color:#17263d;font-weight:700}button{background:transparent;border:1px solid #6d829d;color:#e4efff}button:disabled{opacity:.65;cursor:wait}a:focus-visible,button:focus-visible{outline:3px solid #85b6ff;outline-offset:4px}.note{font-size:13px;margin-top:24px;color:#9eacc0}#status{min-height:3.4em;font-size:14px}
</style></head><body><main class="card"><div class="logo" aria-hidden="true">▶</div><h1>배움</h1><p>짧은 영상으로 배우고,<br>퀴즈로 배움을 확인하세요.</p><div class="actions"><a href="https://baeum-3.onrender.com" target="_blank" rel="noopener noreferrer">학습 시작 ↗</a><button id="retry" type="button">다시 연결 요청</button></div><p id="status" role="status" aria-live="polite">서버에 연결을 요청하고 있습니다.</p><p class="note">학습 화면은 새 창에서 열립니다.<br>첫 접속에는 서버 준비로 잠시 시간이 걸릴 수 있습니다.</p></main><script>
const target='https://baeum-3.onrender.com';
const retry=document.getElementById('retry');
const status=document.getElementById('status');
async function wake(){
retry.disabled=true;
status.textContent='서버에 연결을 요청하고 있습니다. 학습 시작 버튼은 바로 사용할 수 있습니다.';
const controller=new AbortController();
const timer=setTimeout(()=>controller.abort(),20000);
try{
await fetch(target,{mode:'no-cors',cache:'no-store',credentials:'omit',signal:controller.signal});
status.textContent='연결 요청을 보냈습니다. 학습 시작을 눌러 콘텐츠를 확인하세요.';
}catch{
status.textContent='연결 확인이 지연되고 있습니다. 학습 시작을 눌러 접속하거나 다시 연결을 요청하세요.';
}finally{clearTimeout(timer);retry.disabled=false;}
}
retry.addEventListener('click',wake);
wake();
</script></body></html>
